		<script>
			// The SDK started as Yandex documents it (the console checks the page for this); the game takes
			// the result from window.__ysdk (yandex-games-kit, platform/yandex.ts): the ysdk, or null with no
			// SDK (locally /sdk.js 404s) or a failed init -- then the stub platform runs.
			var sdkDone;
			var sdkStarted = false;
			window.__ysdk = new Promise(function (resolve) {
				sdkDone = resolve;
			});
			async function initSDK() {
				if (sdkStarted) return;
				sdkStarted = true;
				try {
					const ysdk = await YaGames.init();
					sdkDone(ysdk);
				} catch (e) {
					sdkDone(null);
				}
			}
			document.currentScript.previousElementSibling.addEventListener("error", function () {
				sdkDone(null);
			});
			// loaded before this line ran (its onload then found no initSDK yet)
			if (window.YaGames) initSDK();
		</script>
